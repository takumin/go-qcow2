---
# octocov configuration. See https://github.com/k1LoW/octocov
#
# Informational only: no `coverage.acceptable` / `codeToTestRatio.acceptable`
# thresholds are set, so octocov never fails the build (keeps coverage
# non-gating). Test Execution Time is measured automatically on GitHub Actions,
# so no `testExecutionTime` block is needed.
coverage:
  # Go cover profile generated by `just coverage` in wc-coverage.yml.
  paths:
  - coverage/coverage.out
codeToTestRatio:
  code:
  - '**/*.go'
  - '!**/*_test.go'
  test:
  - '**/*_test.go'
comment:
  if: is_pull_request
  updatePrevious: true
report:
  # Publish the report to GitHub Actions Artifacts only from the default branch,
  # so the aggregating repo (takumin/octocov-central) sees main's coverage and
  # PR diffs compare against it.
  if: is_default_branch
  datastores:
  - artifact://${GITHUB_REPOSITORY}
diff:
  # Compare the current run against the report stored in the Artifacts datastore.
  datastores:
  - artifact://${GITHUB_REPOSITORY}
