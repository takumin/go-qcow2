---
runner:
  editorconfig-checker:
    cmd: editorconfig-checker -no-color -format default
    errorformat:
    - '%-G%+P%f:'
    - '%\s%+%l: %m'
    - '%-Q'
    - '%-G%.%#'
  biome:
    cmd: biome lint --reporter=rdjson . 2>/dev/null
    format: rdjson
  yamllint:
    cmd: yamllint -f parsable .
    format: yamllint
  jactionlint:
    cmd: jactionlint --shellcheck shellcheck --format sarif
    format: sarif
  ghalint-run:
    cmd: ghalint --log-color never run
    errorformat:
    - '%.%#error="%m" job_name=%.%#workflow_file_path=%f'
    - '%-G%.%#'
  zizmor:
    cmd: zizmor --quiet --no-progress --format=sarif .
    format: sarif
  gosec:
    cmd: gosec -quiet -fmt golint ./...
    format: gosec
  golangci-lint:
    cmd: golangci-lint run --output.text.path stdout ./...
    format: golangci-lint
