---
name: Build
on:
  workflow_call:
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup aqua
      uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.65.0
    - name: Restore go mod cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: deps-${{ hashFiles('**/go.sum') }}
        restore-keys: |-
          deps-
        path: ~/go/pkg/mod/
    - name: Restore aqua cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: aqua-${{ hashFiles('.aqua/**/*.yaml', '.aqua/**/*.yml') }}
        restore-keys: |-
          aqua-
        path: ~/.local/share/aquaproj-aqua/
    - name: Restore go build cache
      id: go-build
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: go-build-build-${{ hashFiles('**/go.sum') }}
        restore-keys: |-
          go-build-build-
        path: ~/.cache/go-build
    - name: Build
      run: |-
        just build
    - name: Save go build cache
      if: github.ref == 'refs/heads/main' && steps.go-build.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.go-build.outputs.cache-primary-key }}
        path: ~/.cache/go-build
